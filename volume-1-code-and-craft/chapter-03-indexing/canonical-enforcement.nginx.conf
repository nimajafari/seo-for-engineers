# canonical-enforcement.nginx.conf
#
# Reference nginx configuration for the canonicalization patterns
# described in Chapter 3 of SEO for Engineers, Volume 1. It enforces a
# single canonical URL shape across three dimensions:
#
#   1. Protocol. Every HTTP request 301-redirects to HTTPS.
#   2. Host.     Non-www 301-redirects to www. Swap the directives if
#                your canonical choice is non-www.
#   3. Trailing slash. Non-root URLs without a corresponding on-disk
#                directory 301-redirect to the no-trailing-slash form.
#
# URL casing should be handled at the application layer, not here. See
# Chapter 3 for the rationale.
#
# To adapt this file:
#   - Replace example.com with your domain.
#   - Point ssl_certificate / ssl_certificate_key at your real certificate
#     and key, or remove the SSL block entirely if TLS is terminated
#     upstream (at a load balancer or CDN).
#
# Reference: SEO for Engineers, Volume 1, Chapter 3.

# 1. HTTP -> HTTPS-www.
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://www.example.com$request_uri;
}

# 2. HTTPS non-www -> HTTPS-www.
server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    return 301 https://www.example.com$request_uri;
}

# 3. Canonical: HTTPS-www, no trailing slash.
server {
    listen 443 ssl;
    server_name www.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    # Strip trailing slashes from non-directory URLs. The -d test skips
    # real on-disk directories so legitimate /foo/ -> index.html requests
    # are not rewritten to /foo. Safe in static, hybrid, and pure-proxy
    # setups; in a pure-proxy setup the guard is a no-op and the rewrite
    # applies to every non-root URL with a trailing slash.
    if (!-d $request_filename) {
        rewrite ^/(.+)/$ /$1 permanent;
    }

    # ... application config (proxy_pass / fastcgi_pass / try_files etc.)
}
