# serve-robots-nginx.conf
#
# Host-based robots.txt serving for Chapter 15 of SEO for Engineers,
# Volume 1. This is the chapter's primary structural defense against
# the catastrophic-failure pattern: a staging robots.txt (which blocks
# all crawlers) shipping to production.
#
# The idea is to never let robots.txt be a static file in the repo
# root that a build script might copy from the wrong environment.
# Instead, the file content is tied to the request host, so the only
# way to serve "Disallow: /" on the production host is to write that
# rule against the production host explicitly. The default branch is
# the safe-for-non-production "block everything" body, so any host
# that is NOT explicitly recognized as production is kept out of the
# index rather than accidentally exposed.
#
# nginx interprets the \n escape sequences in these quoted strings as
# real newlines, so the served body is a valid multi-line robots.txt.
#
# Pair this with:
#   - check-robots-google-parser.sh / robots-ci-check.py  (pre-deploy)
#   - robots-post-deploy-smoke.py                          (post-deploy)
# so the content this config serves is also verified in CI.
#
# Reference: SEO for Engineers, Volume 1, Chapter 15.

# Map the request host to the robots.txt body it should serve.
# The default is the restrictive body: any host not matched below
# (staging, preview, an unexpected internal hostname) blocks crawlers.
map $host $robots_body {
    default                   "User-agent: *\nDisallow: /\n";

    # Production hosts get the permissive body. Add every production
    # hostname that should be crawlable here, apex and www included.
    "~^(www\.)?example\.com$" "User-agent: *\nAllow: /\nSitemap: https://www.example.com/sitemap.xml\n";
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com example.com staging.example.com;

    # Serve robots.txt from the map above, bypassing any application
    # logic, caching layer, or static-file handler that could fail or
    # serve the wrong file. Keep this resource boringly reliable: a 5xx
    # here makes Googlebot treat the whole origin as disallowed.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 $robots_body;
    }

    # ... the rest of the server configuration.
}
