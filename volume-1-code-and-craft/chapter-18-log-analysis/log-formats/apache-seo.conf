# apache-seo.conf
#
# Apache equivalent of the nginx seo_combined format from Chapter 18
# section 18.2 of SEO for Engineers, Volume 1. Place in the server
# config or a conf-enabled snippet. The output is parsed by
# parse_logs.py's NCSA Combined reader in this directory.
#
# %D is request time in microseconds. The {%Y-%m-%dT%H:%M:%S%z}t token
# emits an ISO 8601 timestamp, matching the nginx config and easing
# downstream parsing. %{HTTPS}e records whether the request arrived
# over TLS (requires mod_ssl).
#
# Apache has no built-in JSON log format; if you want JSON (the
# chapter's recommendation), either post-process this Combined output
# through parse_logs.py or front Apache with a log shipper that emits
# JSON.
#
# Reference: SEO for Engineers, Volume 1, Chapter 18.

LogFormat "%h %l %u %{%Y-%m-%dT%H:%M:%S%z}t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D %{Host}i %{HTTPS}e" seo_combined

CustomLog /var/log/apache2/access.log seo_combined
