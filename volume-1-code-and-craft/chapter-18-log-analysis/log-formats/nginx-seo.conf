# nginx-seo.conf
#
# Recommended nginx log_format directives for SEO log analysis, from
# Chapter 18 section 18.2 of SEO for Engineers, Volume 1.
#
# Place these in the http {} block of nginx.conf (or a conf.d
# snippet), then point access_log at one of them. The output is
# consumed directly by parse_logs.py in this directory, which
# normalizes it (alongside Apache, ALB, and Cloudflare formats) into
# the JSON Lines schema enrich_logs.py and crawl_analytics.sql expect.
# The seo_json keys below are exactly the keys parse_logs.py's JSON
# reader looks for (timestamp, remote_addr, method, host, uri, status,
# bytes_sent, referer, user_agent, request_time).
#
# Prefer seo_json. The chapter's guidance is unambiguous: if you are
# configuring logging today, emit JSON. It costs slightly more storage
# and parses trivially, with no fragile field-position assumptions.
# seo_combined is provided only for environments where the Combined
# Log Format is mandated.
#
# Two fields beyond the Combined baseline matter for SEO:
#   $request_time           full request time (client's perspective)
#   $upstream_response_time time your application took
# Slow responses to Googlebot reduce effective crawl budget, so both
# are worth capturing. $time_iso8601 is far easier to parse than the
# traditional [dd/MMM/yyyy:HH:mm:ss Z] format.
#
# Reference: SEO for Engineers, Volume 1, Chapter 18.

# --- Combined-style (legacy; use only if JSON is not an option) ---
log_format seo_combined '$remote_addr - $remote_user [$time_iso8601] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$request_time $upstream_response_time '
                        '$host $scheme "$http_x_forwarded_for"';

# --- JSON (recommended) ---
log_format seo_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"scheme":"$scheme",'
    '"forwarded_for":"$http_x_forwarded_for"'
'}';

# Point the access log at the recommended format.
access_log /var/log/nginx/access.log seo_json;
